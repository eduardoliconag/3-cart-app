<div class="card">
  <img 
    [src]="product.imageUrl" 
    class="card-img-top" 
    [alt]="product.name" />
  <div class="card-body">
    <h5 class="card-title">{{ product.name }}</h5>
    <p class="card-text">{{ product.description }}</p>
    <p class="card-text">$ {{ product.price }}</p>

    <button
      class="btn btn-primary"
      type="button"
      (click)="addItem()"
    >
      Add to Cart
    </button>
  </div>
</div>
